<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inside the Box</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.__BOX_GAME_BUILD__ = "20260829-mobile4";
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="overlay">
    <div id="title-card">
      <h1>Inside the Box</h1>
      <p>You are here. That is all there is.</p>
      <button id="enter-btn" type="button">Step inside</button>
      <p class="hint desktop-hint">WASD to move · Mouse to look · Shift to sprint · Esc to release mouse</p>
      <p class="hint mobile-hint">Left stick to move · Drag right side to look · Hold Run to sprint</p>
    </div>
  </div>

  <div id="hud" hidden>
    <p id="status">Just a box.</p>
    <p id="thoughts"></p>
  </div>

  <div id="mobile-controls">
    <div id="joystick-zone" aria-label="Move">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>
    <div id="look-zone" aria-label="Look around"></div>
    <button id="sprint-btn" type="button" aria-label="Sprint">Run</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js?v=20260829-mobile4"></script>
</body>
</html>
