name: Deploy Box Game

on:
  push:
    branches: [main, cursor/inside-box-game-9d6c]
    paths:
      - 'box-game/**'
      - '.github/workflows/deploy-box-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: box-game
      - id: deployment
        uses: actions/deploy-pages@v4
