name: Deploy Baby Boot Game

on:
  push:
    branches: [main, cursor/baby-kick-stress-game-bf4a]
    paths: [baby-kick-game/**, .github/workflows/deploy-game.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: baby-kick-game

      - id: deployment
        uses: actions/deploy-pages@v4
