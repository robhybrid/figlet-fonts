name: Deploy Baby Boot Game

on:
  push:
    branches: [main]
    paths: [baby-kick-game/**, .github/workflows/deploy-game.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./baby-kick-game
          publish_branch: gh-pages
          force_orphan: true
