name: Deploy Classroom Game

on:
  push:
    branches: [main, cursor/classroom-game-053c]
    paths:
      - 'classroom-game/**'
      - '.github/workflows/deploy-classroom-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-classroom
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: classroom-game
      - id: deployment
        uses: actions/deploy-pages@v4
